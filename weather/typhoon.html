<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5aa7e6">
<title>台风路径</title>
<style>
  @font-face{font-family:'Nunito';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/nunito-400.ttf) format('truetype')}
  @font-face{font-family:'Nunito';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-700.ttf) format('truetype')}
  @font-face{font-family:'Nunito';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/nunito-800.ttf) format('truetype')}
  @font-face{font-family:'Nunito';font-style:normal;font-weight:900;font-display:swap;src:url(fonts/nunito-900.ttf) format('truetype')}
  :root{
    --sky-1:#3b8fd9; --sky-2:#5aa7e6; --sky-3:#8fc6f0;
    --bg-1:#e9f4fe; --bg-2:#d4e9fb;
    --card:#ffffff;
    --ink:#16364f; --ink-soft:#5d7b93; --ink-faint:#9bb3c7;
    --line:#eaf1f8;
    --primary:#3b8fd9; --primary-d:#2f7bc0;
    --warn:#ff8a4c; --warn-d:#f1662b;
    --danger:#ef5350; --danger-d:#d32f2f;
    --safe:#46c47c;
    --radius:26px;
    --shadow:0 14px 34px -16px rgba(45,98,140,.32);
    --shadow-sm:0 6px 16px -8px rgba(45,98,140,.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    font-family:"Nunito",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg-1),var(--bg-2));
    background-attachment:fixed;min-height:100%;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    display:flex;justify-content:center;
    padding:max(14px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));
  }
  .app{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px;animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .app>*{flex-shrink:0}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* 顶栏 */
  .topbar{display:flex;align-items:center;gap:10px;padding:4px 2px}
  .back{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:none;background:#fff;color:var(--primary);box-shadow:var(--shadow-sm);cursor:pointer;flex:none}
  .back:active{transform:scale(.94)}
  .topbar h1{font-size:18px;font-weight:900;letter-spacing:.01em;flex:1}
  .topbar .ts{font-size:11px;font-weight:700;color:var(--ink-faint);background:#fff;padding:4px 10px;border-radius:20px;box-shadow:var(--shadow-sm)}

  /* 卡片 */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px}
  .card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .card-h .t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900}
  .card-h .t svg{width:20px;height:20px;color:var(--primary)}
  .card-h .sub{font-size:11px;font-weight:700;color:var(--ink-faint)}

  /* 台风头部 */
  .ty-hero{position:relative;overflow:hidden;background:linear-gradient(150deg,var(--sky-1),var(--sky-2) 60%,var(--sky-3));color:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .ty-hero .deco{position:absolute;right:-20px;top:-20px;width:140px;height:140px;border-radius:50%;border:18px solid rgba(255,255,255,.12);animation:spin 18s linear infinite}
  .ty-hero .deco2{position:absolute;right:10px;top:10px;width:80px;height:80px;border-radius:50%;border:10px solid rgba(255,255,255,.18);animation:spin 12s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ty-head{position:relative;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ty-name{font-size:30px;font-weight:900;letter-spacing:.01em;text-shadow:0 2px 8px rgba(20,70,120,.25)}
  .ty-en{font-size:14px;font-weight:800;opacity:.9}
  .ty-code{position:relative;display:inline-block;margin-top:10px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800}
  .ty-status{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative}
  .ty-pill{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);padding:6px 12px;border-radius:14px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
  .ty-pill .dot{width:7px;height:7px;border-radius:50%;background:#bff0a0;box-shadow:0 0 0 3px rgba(191,240,160,.3)}
  .ty-pill.end .dot{background:#ffb3b3;box-shadow:0 0 0 3px rgba(255,179,179,.3)}
  .ty-pill b{font-weight:900;margin-left:2px}

  /* 距离条 */
  .dist{position:relative;margin-top:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);border-radius:16px;padding:12px 14px}
  .dist .row{display:flex;align-items:baseline;justify-content:space-between}
  .dist .lab{font-size:12px;font-weight:800;opacity:.9}
  .dist .val{font-size:24px;font-weight:900}
  .dist .unit{font-size:13px;font-weight:800;opacity:.85;margin-left:3px}
  .dist .bar{margin-top:10px;height:6px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
  .dist .bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#bff0a0,#ffe08a,#ff9b6b)}

  /* 当前强度网格 */
  .now-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;position:relative}
  .now-cell{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.24);border-radius:14px;padding:12px}
  .now-cell .l{font-size:11px;font-weight:800;opacity:.85}
  .now-cell .v{font-size:22px;font-weight:900;margin-top:3px}
  .now-cell .v small{font-size:11px;font-weight:800;opacity:.8;margin-left:2px}
  .lvl-badge{display:inline-block;font-size:11px;font-weight:900;padding:3px 9px;border-radius:10px;margin-top:6px}

  /* 预报表 */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
  th{font-size:11px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
  td{font-weight:700;color:var(--ink)}
  td.time{font-weight:800;color:var(--primary)}
  tr:last-child td{border-bottom:none}
  tr.fc td{background:#f7fbff;color:var(--ink-soft)}
  tr.fc td.time{color:var(--warn-d)}
  .lvl{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:8px}
  .lvl-td{background:#e3f2fd;color:#1976d2}
  .lvl-ts{background:#fff3e0;color:#f57c00}
  .lvl-sts{background:#ffe0b2;color:#e65100}
  .lvl-ty{background:#ffcdd2;color:#c62828}
  .lvl-sty{background:#f8bbd0;color:#ad1457}
  .lvl-super{background:#e1bee7;color:#6a1b9a}

  /* 路径时间线 */
  .track-wrap{max-height:340px;overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
  .track-wrap::-webkit-scrollbar{width:4px}
  .track-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .tl{position:relative;padding-left:22px}
  .tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:7px 0 7px 6px}
  .tl-item::before{content:'';position:absolute;left:-19px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary)}
  .tl-item.now::before{background:var(--danger);box-shadow:0 0 0 2px var(--danger),0 0 0 6px rgba(239,83,80,.18);width:13px;height:13px;left:-21px;top:11px}
  .tl-item .tt{font-size:12.5px;font-weight:800;color:var(--primary)}
  .tl-item.now .tt{color:var(--danger-d)}
  .tl-item .td{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:2px}
  .tl-item .td span{white-space:nowrap}
  .tl-item .coord{font-family:"Nunito",monospace;color:var(--ink-faint);font-weight:800}

  /* 历史列表 */
  .hist-item{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)}
  .hist-item:last-child{border-bottom:none}
  .hist-num{width:40px;height:40px;border-radius:12px;background:#eef6fd;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex:none}
  .hist-num.end{background:#f5f5f5;color:var(--ink-faint)}
  .hist-info{flex:1;min-width:0}
  .hist-info .n{font-size:14px;font-weight:800}
  .hist-info .s{font-size:11px;font-weight:700;color:var(--ink-faint);margin-top:2px}
  .hist-tag{font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:8px;background:#e3f2fd;color:#1976d2;flex:none}
  .hist-tag.end{background:#f5f5f5;color:var(--ink-faint)}

  /* 空态 / 加载 */
  .empty{text-align:center;padding:40px 20px;color:var(--ink-faint);font-size:13px;font-weight:700}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,var(--bg-1),var(--bg-2));z-index:50;transition:opacity .4s}
  .overlay.hide{opacity:0;pointer-events:none}
  .loader-cyc{width:60px;height:60px;animation:spin 1.4s linear infinite}
  .overlay p{font-size:14px;font-weight:800;color:var(--ink-soft)}
  .err-box{text-align:center;max-width:300px}
  .err-box h3{font-size:16px;font-weight:900;margin-bottom:6px}
  .err-box p{font-size:12.5px;font-weight:700;line-height:1.5;margin-bottom:14px}
  .retry{border:none;cursor:pointer;background:var(--primary);color:#fff;font-family:inherit;font-weight:800;font-size:13px;padding:10px 22px;border-radius:16px;box-shadow:var(--shadow-sm)}
  .retry:active{transform:scale(.96)}
  .footer{text-align:center;font-size:11px;font-weight:700;color:var(--ink-faint);line-height:1.6;padding:6px 0}

  @media (max-width:360px){
    .ty-name{font-size:26px}
    .now-grid{gap:8px}
    .now-cell .v{font-size:19px}
  }
</style>
</head>
<body>
  <div class="app" id="app" style="visibility:hidden">
    <div class="topbar">
      <button class="back" onclick="history.back()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1>台风路径</h1>
      <span class="ts" id="topCount">—</span>
    </div>
    <div id="activeBox"></div>
    <div class="card" id="historyCard" style="display:none">
      <div class="card-h"><div class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>历史台风</span></div><div class="sub" id="histSub">本年度</div></div>
      <div id="historyList"></div>
    </div>
    <div class="footer">数据来源 ovo.shuoweb.com · 更新于 <span id="updated">—</span></div>
  </div>

  <div class="overlay" id="overlay">
    <svg class="loader-cyc" viewBox="0 0 64 64"><g fill="none" stroke="#3b8fd9" stroke-width="4" stroke-linecap="round"><path d="M32 6a26 26 0 1 0 26 26" stroke-dasharray="40 120"/></g><circle cx="32" cy="32" r="7" fill="#3b8fd9"/></svg>
    <p>正在获取台风信息…</p>
  </div>

<script>
(function(){
  "use strict";
  var API = "https://ovo.shuoweb.com/weather/?type=typhoon";
  var LVL = {
    "TD":"热带低压","TS":"热带风暴","STS":"强热带风暴","TY":"台风","STY":"强台风","SUPER":"超强台风"
  };
  var LVLCLS = {"TD":"lvl-td","TS":"lvl-ts","STS":"lvl-sts","TY":"lvl-ty","STY":"lvl-sty","SUPER":"lvl-super"};
  var MOVEDIR = {"N":"北","NNE":"北东北","NE":"东北","ENE":"东东北","E":"东","ESE":"东东南","SE":"东南","SSE":"南东南","S":"南","SSW":"南西南","SW":"西南","WSW":"西西南","W":"西","WNW":"西西北","NW":"西北","NNW":"北西北"};

  function buildUrl(){
    var u = API;
    try {
      var c = window.AndroidWeather && window.AndroidWeather.getCoords();
      if (c) { var o = JSON.parse(c); if (o && o.lng && o.lat) { u = API + "&lng=" + o.lng + "&lat=" + o.lat; } }
    } catch (e) {}
    return u;
  }

  function lvlName(en){ return LVL[en] || en || "—"; }
  function lvlCls(en){ return LVLCLS[en] || "lvl-td"; }
  function moveName(d){ return MOVEDIR[d] || d || "—"; }
  function fmtTime(t){ if(!t) return "—"; return t.slice(5,16).replace(" "," "); }
  function fmtCoord(lat, lon){
    var la = Math.abs(lat).toFixed(1)+(lat>=0?"°N":"°S");
    var lo = Math.abs(lon).toFixed(1)+(lon>=0?"°E":"°W");
    return la+" "+lo;
  }
  function distLevel(km){
    if(km==null) return {txt:"未知",cls:"lvl-td",pct:0};
    if(km<300) return {txt:"极近",cls:"lvl-super",pct:95};
    if(km<800) return {txt:"较近",cls:"lvl-ty",pct:75};
    if(km<1500) return {txt:"中等",cls:"lvl-sts",pct:55};
    if(km<2500) return {txt:"较远",cls:"lvl-ts",pct:35};
    return {txt:"很远",cls:"lvl-td",pct:18};
  }

  function renderActive(data){
    var box = document.getElementById("activeBox");
    var list = data.typhoons || [];
    document.getElementById("topCount").textContent = (data.active_count!=null?data.active_count:list.length)+" 个活跃";
    if(!list.length){
      box.innerHTML = '<div class="card"><div class="empty">当前暂无活跃台风</div></div>';
      return;
    }
    var html = "";
    list.forEach(function(ty){
      var tracks = ty.tracks || [];
      var cur = tracks.length ? tracks[tracks.length-1] : null;
      var fc = ty.forecast || {};
      var dl = distLevel(ty.distance_km);
      html += '<section class="ty-hero">';
      html += '<div class="deco"></div><div class="deco2"></div>';
      html += '<div class="ty-head"><span class="ty-name">'+ty.name_cn+'</span><span class="ty-en">'+(ty.name_en||"")+'</span></div>';
      html += '<span class="ty-code">'+ty.code_text+'</span>';
      var pills = '<div class="ty-status">';
      pills += '<span class="ty-pill'+(ty.is_end?' end':'')+'"><span class="dot"></span>'+(ty.is_end?'已停编':'活跃中')+'</span>';
      if(cur){ pills += '<span class="ty-pill">强度 <b>'+lvlName(cur.type_en)+'</b></span>'; }
      if(ty.distance_km!=null){ pills += '<span class="ty-pill">距你 <b>'+ty.distance_km+'km</b></span>'; }
      pills += '</div>';
      html += pills;

      // 距离条
      if(ty.distance_km!=null){
        html += '<div class="dist"><div class="row"><span class="lab">距离当前位置</span><span><span class="val">'+ty.distance_km+'</span><span class="unit">km · '+dl.txt+'</span></span></div>';
        html += '<div class="bar"><i style="width:'+dl.pct+'%"></i></div></div>';
      }

      // 当前强度
      if(cur){
        html += '<div class="now-grid">';
        html += '<div class="now-cell"><div class="l">中心位置</div><div class="v" style="font-size:14px;line-height:1.3">'+fmtCoord(cur.lat,cur.lon)+'</div></div>';
        html += '<div class="now-cell"><div class="l">最大风力</div><div class="v">'+cur.wind_level+'<small>级</small></div><span class="lvl-badge '+lvlCls(cur.type_en)+'">'+cur.type_cn+'</span></div>';
        html += '<div class="now-cell"><div class="l">中心风速</div><div class="v">'+cur.speed_ms+'<small>m/s</small></div></div>';
        html += '<div class="now-cell"><div class="l">中心气压</div><div class="v">'+cur.pressure_hpa+'<small>hPa</small></div></div>';
        html += '</div>';
      }
      html += '</section>';

      // 预报表
      var fkeys = ["6h","12h","24h","48h"];
      var hasFc = fkeys.some(function(k){ return fc[k]; });
      if(hasFc){
        html += '<section class="card"><div class="card-h"><div class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>未来路径预报</span></div><div class="sub">中央气象台</div></div>';
        html += '<table><thead><tr><th>时效</th><th>位置</th><th>风力</th><th>气压</th><th>强度</th></tr></thead><tbody>';
        fkeys.forEach(function(k){
          var f = fc[k]; if(!f) return;
          html += '<tr class="fc"><td class="time">'+k+'</td>';
          html += '<td style="font-size:11px">'+fmtCoord(f.lat,f.lon)+'</td>';
          html += '<td>'+f.level+'级</td><td>'+f.pressure+'</td>';
          html += '<td><span class="lvl '+lvlCls(f.type)+'">'+lvlName(f.type)+'</span></td></tr>';
        });
        html += '</tbody></table></section>';
      }

      // 路径时间线
      if(tracks.length){
        html += '<section class="card"><div class="card-h"><div class="t"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><circle cx="3" cy="17" r="1.6" fill="currentColor"/><circle cx="21" cy="9" r="1.6" fill="currentColor"/></svg><span>路径轨迹</span></div><div class="sub">'+tracks.length+'个点位</div></div>';
        html += '<div class="track-wrap"><div class="tl">';
        // 倒序展示，最新在上
        for(var i=tracks.length-1;i>=0;i--){
          var tr = tracks[i];
          var isNow = (i===tracks.length-1);
          html += '<div class="tl-item'+(isNow?' now':'')+'">';
          html += '<div class="tt">'+(isNow?'当前位置 · ':'')+fmtTime(tr.time)+'</div>';
          html += '<div class="td"><span class="coord">'+fmtCoord(tr.lat,tr.lon)+'</span>';
          html += '<span>'+tr.wind_level+'级 '+tr.speed_ms+'m/s</span>';
          html += '<span>'+tr.pressure_hpa+'hPa</span>';
          html += '<span class="lvl '+lvlCls(tr.type_en)+'" style="font-size:10px">'+tr.type_cn+'</span>';
          if(tr.move_dir) html += '<span>移向'+moveName(tr.move_dir)+' '+tr.move_speed+'km/h</span>';
          html += '</div></div>';
        }
        html += '</div></div></section>';
      }
    });
    box.innerHTML = html;
  }

  function renderHistory(data){
    var h = data.history || [];
    if(!h.length){ document.getElementById("historyCard").style.display="none"; return; }
    document.getElementById("historyCard").style.display="";
    document.getElementById("histSub").textContent = h.length+" 个";
    var html = "";
    h.forEach(function(ty){
      html += '<div class="hist-item">';
      html += '<div class="hist-num'+(ty.is_end?' end':'')+'">'+(ty.code||"").slice(-2)+'</div>';
      html += '<div class="hist-info"><div class="n">'+ty.name_cn+' '+(ty.name_en?("("+ty.name_en+")"):"")+'</div>';
      html += '<div class="s">'+ty.code_text+(ty.distance_km!=null?(' · 距你 '+ty.distance_km+'km'):"")+'</div></div>';
      html += '<span class="hist-tag'+(ty.is_end?' end':'')+'">'+(ty.is_end?'已停编':'活跃')+'</span>';
      html += '</div>';
    });
    document.getElementById("historyList").innerHTML = html;
  }

  function apply(data){
    if(!data || data.code!==0){ throw new Error("数据格式异常"); }
    renderActive(data);
    renderHistory(data);
    var d = new Date(data.updated_at);
    document.getElementById("updated").textContent = (d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
    document.getElementById("app").style.visibility="visible";
    document.getElementById("overlay").classList.add("hide");
  }
  function showError(msg){
    var ov = document.getElementById("overlay");
    ov.innerHTML = '<div class="err-box"><h3>获取失败</h3><p>'+(msg||"请检查网络后重试")+'</p><button class="retry" onclick="location.reload()">重新加载</button></div>';
    ov.classList.remove("hide");
  }
  function load(){
    fetch(buildUrl(),{headers:{Accept:"application/json"}})
      .then(function(r){ if(!r.ok) throw new Error("网络错误 ("+r.status+")"); return r.json(); })
      .then(apply)
      .catch(function(e){ showError(e.message||"请求失败"); });
  }
  window.__reloadTyphoon = load;
  load();
})();
</script>
</body>
</html>
