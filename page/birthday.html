<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F0EA">
<title>生日日历 · 高二</title>
<style>
  :root{
    --ink:#111110;
    --paper:#F2F0EA;
    --red:#E1251B;
    --muted:#6C6862;
    --rule:rgba(17,17,16,.16);
    --rule-strong:rgba(17,17,16,.9);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-feature-settings:"tnum" 1,"lnum" 1;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  body::before{content:"";display:block;height:5px;background:var(--red);}
  ::selection{background:var(--red);color:#fff;}
  .page{max-width:660px;margin:0 auto;padding:0 22px calc(26px + env(safe-area-inset-bottom));}

  .topline{display:flex;align-items:center;gap:9px;padding:18px 0 13px;border-bottom:2px solid var(--ink);}
  .dot{width:7px;height:7px;background:var(--red);flex:none;}
  .label{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;}
  .clock{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:.14em;color:var(--muted);}

  .hero{padding:24px 0 20px;border-bottom:2px solid var(--ink);}
  .hero-kicker{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .hero-num{
    display:flex;align-items:baseline;gap:.03em;
    font-size:clamp(74px,25vw,126px);line-height:.8;font-weight:700;letter-spacing:-.055em;
  }
  .hero-num .sep{color:var(--red);transform:translateY(-.06em);}
  .hero-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:18px;}
  .date-line{font-size:12px;letter-spacing:.1em;}
  .count-block{display:flex;align-items:baseline;gap:5px;white-space:nowrap;}
  .count-num{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;}
  .count-unit{font-size:9.5px;letter-spacing:.16em;color:var(--muted);}

  .list-head{display:flex;justify-content:space-between;align-items:baseline;padding:24px 0 4px;}
  .list-head .label{color:var(--ink);}
  .list-head .total{font-size:9.5px;letter-spacing:.16em;color:var(--muted);}

  ul{list-style:none;margin:0;padding:0;}
  .row{
    display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;
    padding:15px 0;border-bottom:1px solid var(--rule);
  }
  .row:first-child{border-top:1px solid var(--rule);}
  .idx{font-size:9.5px;letter-spacing:.1em;color:var(--red);font-variant-numeric:tabular-nums;}
  .name{display:block;font-size:clamp(19px,5.6vw,23px);font-weight:600;letter-spacing:.02em;line-height:1.2;}
  .born{display:block;margin-top:5px;font-size:10px;letter-spacing:.13em;color:var(--muted);font-variant-numeric:tabular-nums;}
  .age{display:flex;align-items:baseline;gap:3px;}
  .age-num{font-size:28px;font-weight:700;letter-spacing:-.04em;line-height:1;}
  .age-unit{font-size:9.5px;letter-spacing:.1em;color:var(--muted);}

  .empty{padding:40px 0 34px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
  .empty-mark{font-size:56px;font-weight:700;line-height:.8;color:var(--red);letter-spacing:-.04em;}
  .empty-title{margin:20px 0 0;font-size:17px;font-weight:600;letter-spacing:.02em;}
  .empty-sub{margin:8px 0 0;font-size:10.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;}

  .foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 0 0;font-size:8.5px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;}
  @media (min-width:640px){
    .page{padding-left:28px;padding-right:28px;}
    .row{padding:17px 0;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="topline">
      <span class="dot" aria-hidden="true"></span>
      <span class="label">生日日历 / Birthday Index</span>
      <span class="label clock" id="clock">--:--:--</span>
    </div>
    <div class="hero">
      <div class="hero-kicker">Today · 今日</div>
      <div class="hero-num"><span id="mm">--</span><span class="sep">.</span><span id="dd">--</span></div>
      <div class="hero-foot">
        <div class="date-line" id="date-line">----年--月--日</div>
        <div class="count-block">
          <span class="count-num" id="count">00</span>
          <span class="count-unit">人 / 今日</span>
        </div>
      </div>
    </div>
  </header>

  <div class="list-head">
    <span class="label">今日生日</span>
    <span class="total">共 2067 人</span>
  </div>

  <ul id="list" aria-live="polite"></ul>

  <footer class="foot">
    <span>仅姓名与生日 · 无班级信息</span>
    <span>系统时间 · 每日 00:00 自动更新</span>
  </footer>
</main>

  var WD = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  var dayKey = '';
  var pad = function(n){ return (n < 10 ? '0' : '') + n; };
  var el = function(id){ return document.getElementById(id); };

  function render(){
    var now = new Date();
    var y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
    el('mm').textContent = pad(m);
    el('dd').textContent = pad(d);
    el('date-line').textContent = y + '年' + m + '月' + d + '日 · ' + WD[now.getDay()];

    var list = DATA.filter(function(r){ return r[2] === m && r[3] === d; });
    list.sort(function(a, b){ return a[0].localeCompare(b[0], 'zh-Hans-CN'); });
    el('count').textContent = pad(list.length);

    var ul = el('list');
    if (!list.length) {
      ul.innerHTML = '<li class="empty">' +
        '<div class="empty-mark">—</div>' +
        '<p class="empty-title">今天没有同学生日</p>' +
        '<p class="empty-sub">No birthdays today</p></li>';
    } else {
      ul.innerHTML = list.map(function(r, i){
        return '<li class="row">' +
          '<span class="idx">' + pad(i + 1) + '</span>' +
          '<div class="who">' +
            '<span class="name">' + escapeHtml(r[0]) + '</span>' +
            '<span class="born">' + r[1] + '.' + pad(r[2]) + '.' + pad(r[3]) + '</span>' +
          '</div>' +
          '<div class="age"><span class="age-num">' + (y - r[1]) + '</span><span class="age-unit">岁</span></div>' +
        '</li>';
      }).join('');
    }
    dayKey = y + '-' + m + '-' + d;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function clock(){
    var n = new Date();
    el('clock').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
  }

  function checkDay(){
    var n = new Date();
    var k = n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate();
    if (k !== dayKey) render();
  }

  render();
  clock();
  setInterval(clock, 1000);
  setInterval(checkDay, 20000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) { clock(); checkDay(); }
  });
