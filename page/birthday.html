<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F2F0EA">
<title>生日日历</title>
<style>
:root{--ink:#111110;--paper:#F2F0EA;--red:#E1251B;--muted:#6C6862;--line:rgba(17,17,16,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font:400 16px/1.4 "Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
body:before{content:"";display:block;height:5px;background:var(--red)}
::selection{background:var(--red);color:#fff}
.page{max-width:660px;margin:0 auto;padding:0 22px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:9px;padding:18px 0 13px;border-bottom:2px solid var(--ink);font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.top i{width:7px;height:7px;background:var(--red);flex:none}
.clock{margin-left:auto;color:var(--muted);font-weight:400;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.hero{padding:22px 0 18px;border-bottom:2px solid var(--ink)}
.num{display:flex;align-items:baseline;font-size:clamp(76px,25vw,128px);line-height:.8;font-weight:700;letter-spacing:-.055em}
.num em{color:var(--red);font-style:normal;transform:translateY(-.06em)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:16px;font-size:12px;letter-spacing:.1em}
.cnt{white-space:nowrap;font-size:9.5px;letter-spacing:.16em;color:var(--muted)}
.cnt b{margin-right:4px;font-size:26px;color:var(--ink);letter-spacing:-.03em}
.pick{display:flex;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.pick input{flex:1;min-width:0;height:40px;padding:0 10px;border:1px solid var(--ink);border-radius:0;background:transparent;color:inherit;font:inherit;font-size:12px;letter-spacing:.06em;accent-color:var(--red)}
.pick input:focus{outline:0;border-color:var(--red)}
.pick button{height:40px;padding:0 15px;border:1px solid var(--ink);border-radius:0;background:var(--ink);color:var(--paper);font:inherit;font-size:10px;letter-spacing:.16em;cursor:pointer}
.pick button:active{background:var(--red);border-color:var(--red)}
.head{display:flex;justify-content:space-between;align-items:baseline;padding:24px 0 4px;font-size:9.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.head span:last-child{color:var(--muted);font-weight:400;letter-spacing:.16em}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}
.row:first-child{border-top:1px solid var(--line)}
.idx{font-size:9.5px;color:var(--red);font-variant-numeric:tabular-nums}
.name{display:block;font-size:clamp(19px,5.6vw,23px);font-weight:600;line-height:1.2;letter-spacing:.02em}
.born{display:block;margin-top:5px;font-size:10px;color:var(--muted);letter-spacing:.13em;font-variant-numeric:tabular-nums}
.age{display:flex;align-items:baseline;gap:3px}
.age b{font-size:28px;line-height:1;letter-spacing:-.04em}
.age span{font-size:9.5px;color:var(--muted);letter-spacing:.1em}
.empty{padding:40px 0 34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.empty div{font-size:56px;font-weight:700;line-height:.8;color:var(--red)}
.empty p{margin:18px 0 0;font-size:16px;font-weight:600;letter-spacing:.02em}
@media(min-width:640px){.page{padding-left:28px;padding-right:28px}.row{padding:17px 0}}
</style>
</head>
<body>
<main class="page">
<header>
  <div class="top"><i></i><span>生日日历 / Birthday Index</span><span class="clock" id="clock"></span></div>
  <div class="hero">
    <div class="num"><span id="mm">--</span><em>.</em><span id="dd">--</span></div>
    <div class="meta"><span id="date"></span><span class="cnt"><b id="count">00</b>人</span></div>
  </div>
  <div class="pick">
    <input type="date" id="pick" aria-label="选择日期">
    <button type="button" id="today">今天</button>
  </div>
</header>
<div class="head"><span>生日名单</span><span id="total"></span></div>
<ul id="list"></ul>
</main>

<script>
var $=function(i){return document.getElementById(i)},D=[],sel='',day='',
WD='日一二三四五六',
p=function(n){return(n<10?'0':'')+n},
esc=function(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function render(){
  var t=new Date(),y,m,d;
  if(sel){y=+sel.slice(0,4);m=+sel.slice(5,7);d=+sel.slice(8,10)}
  else{y=t.getFullYear();m=t.getMonth()+1;d=t.getDate()}
  $('mm').textContent=p(m);$('dd').textContent=p(d);
  $('date').textContent=y+'年'+m+'月'+d+'日 · 星期'+WD[new Date(y,m-1,d).getDay()];
  var L=D.filter(function(r){return r[1]==m&&r[2]==d}).sort(function(a,b){return a[0].localeCompare(b[0],'zh-Hans-CN')});
  $('count').textContent=p(L.length);
  $('list').innerHTML=L.length?L.map(function(r,i){
    return '<li class="row"><span class="idx">'+p(i+1)+'</span><div><span class="name">'+esc(r[0])+
    '</span><span class="born">'+r[3]+'.'+p(m)+'.'+p(d)+'</span></div><div class="age"><b>'+(y-r[3])+
    '</b><span>岁</span></div></li>';
  }).join(''):'<li class="empty"><div>—</div><p>当天没有生日</p></li>';
  $('pick').value=y+'-'+p(m)+'-'+p(d);
  day=y+'-'+p(m)+'-'+p(d);
}
function tick(){var n=new Date();$('clock').textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds())}
$('pick').onchange=function(e){sel=e.target.value||'';render()};
$('today').onclick=function(){sel='';render()};
(async function(){
  try{
    var b=Uint8Array.from(atob($('d').textContent.trim()),function(c){return c.charCodeAt(0)}),
    txt=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text(),
    today=new Date();
    D=txt.trim().split('\n').map(function(s){
      var c=s.slice(-3),dt=new Date(2020,0,parseInt(c.slice(1),36));
      return [s.slice(0,-3),dt.getMonth()+1,dt.getDate(),2000+parseInt(c[0],36)];
    });
    $('total').textContent='共 '+D.length+' 人';
    render();tick();
    setInterval(tick,1000);
    setInterval(function(){
      if(!sel){var n=new Date(),k=n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate());if(k!==day)render()}
    },20000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();
      if(!sel){var n=new Date(),k=n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate());if(k!==day)render()}}});
  }catch(e){$('list').innerHTML='<li class="empty"><div>—</div><p>数据加载失败</p></li>'}
})();
</script>
